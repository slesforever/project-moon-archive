<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>PROJECT MOON ARCHIVE | 專案太陽檔案</title>
  <style>
    :root {
      --pm-bg: #090909;
      --pm-bg-2: #111111;
      --pm-card: #151515;
      --pm-card-2: #1b1b1b;
      --pm-text: #e7e7e7;
      --pm-muted: #a7a7a7;
      --pm-red: #ff3b3b;
      --pm-red-soft: rgba(255, 59, 59, 0.12);
      --pm-gold: #d4af37;
      --pm-border: #2e2e2e;
      --pm-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      --radius: 16px;
      --radius-sm: 10px;
      --max: 1400px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(255, 59, 59, 0.09), transparent 28%),
        linear-gradient(180deg, #0b0b0b 0%, #070707 100%);
      color: var(--pm-text);
      font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;
      background-image: linear-gradient(rgba(255,255,255,0.4) 1px, transparent 1px);
      background-size: 100% 4px;
      z-index: 1;
    }

    .app {
      position: relative;
      z-index: 2;
      min-height: 100vh;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(255, 59, 59, 0.14), transparent 40%),
        #050505;
      transition: opacity .45s ease, visibility .45s ease;
    }
    .loading.hide { opacity: 0; visibility: hidden; }
    .loading-card {
      width: min(92vw, 520px);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(22,22,22,0.96), rgba(8,8,8,0.96));
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03), var(--pm-shadow);
      padding: 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .loading-card::before {
      content: "";
      position: absolute;
      inset: -40% -20%;
      background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.08) 50%, transparent 58%);
      transform: translateX(-40%);
      animation: sweep 1.6s linear infinite;
    }
    @keyframes sweep { 0% { transform: translateX(-40%) rotate(0deg); } 100% { transform: translateX(40%) rotate(0deg); } }
    .loading-title {
      position: relative;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: 0.22em;
      color: #fff;
      text-shadow: 0 0 18px rgba(255,59,59,0.35);
      margin: 0 0 10px;
    }
    .loading-sub {
      position: relative;
      margin: 0 0 18px;
      color: var(--pm-muted);
      letter-spacing: 0.08em;
      font-family: monospace;
    }
    .scanbar {
      position: relative;
      height: 10px;
      background: #0e0e0e;
      border: 1px solid #333;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 18px;
    }
    .scanbar > span {
      display: block;
      height: 100%;
      width: 35%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--pm-red), var(--pm-gold), transparent);
      animation: load 1.3s ease-in-out infinite;
    }
    @keyframes load {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
      background: linear-gradient(180deg, rgba(18, 0, 0, 0.95), rgba(10, 10, 10, 0.92));
      border-bottom: 1px solid rgba(255, 59, 59, 0.55);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }

    .header-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 22px 18px 18px;
    }

    .brand-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .logo {
      font-size: clamp(1.4rem, 3.2vw, 2.45rem);
      letter-spacing: 0.22em;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,59,59,0.35);
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--pm-muted);
      font-size: 0.95rem;
      font-family: monospace;
      letter-spacing: 0.06em;
    }

    .game-nav,
    .sub-nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .game-nav { margin-bottom: 12px; }
    .sub-nav { margin-bottom: 14px; }

    button {
      appearance: none;
      border: 1px solid var(--pm-gold);
      background: rgba(255,255,255,0.01);
      color: var(--pm-gold);
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform .18s ease, background .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 0 0 1px rgba(212,175,55,0.22), 0 0 18px rgba(212,175,55,0.16); }
    button.active {
      background: var(--pm-gold);
      color: #0a0a0a;
      border-color: var(--pm-gold);
      box-shadow: 0 0 20px rgba(212,175,55,0.28);
    }
    .sub-nav button {
      border-color: #333;
      color: #9c9c9c;
      background: rgba(255,255,255,0.01);
      font-size: 0.92rem;
      padding: 8px 13px;
    }
    .sub-nav button.active {
      border-color: var(--pm-red);
      color: var(--pm-red);
      background: var(--pm-red-soft);
      box-shadow: 0 0 0 1px rgba(255,59,59,0.12);
    }

    .search-row {
      max-width: 720px;
      margin: 0 auto;
      padding: 4px 0 0;
    }
    .search-wrap {
      position: relative;
    }
    .search-wrap::before {
      content: ">";
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--pm-red);
      font-family: monospace;
      font-size: 1.1rem;
      pointer-events: none;
    }
    #search {
      width: 100%;
      border-radius: 14px;
      border: 1px solid #363636;
      background: #0f0f0f;
      color: #f1f1f1;
      padding: 13px 14px 13px 34px;
      outline: none;
      font-size: 0.98rem;
      font-family: monospace;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    #search:focus {
      border-color: rgba(255, 59, 59, 0.8);
      box-shadow: 0 0 0 4px rgba(255,59,59,0.12);
    }

    main {
      position: relative;
      z-index: 2;
    }

    .grid {
      max-width: var(--max);
      margin: 0 auto;
      padding: 24px 16px 42px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 18px;
    }

    .card {
      background: linear-gradient(180deg, var(--pm-card), var(--pm-card-2));
      border: 1px solid var(--pm-border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--pm-shadow);
      transform: translateY(0);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
      position: relative;
      min-height: 100%;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(212,175,55,0.75);
      box-shadow: 0 14px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,175,55,0.08);
    }

    .img-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.2;
      background: linear-gradient(135deg, #060606, #141414);
      overflow: hidden;
      border-bottom: 1px solid #262626;
    }
    .img-box::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,0.45));
      pointer-events: none;
    }
    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.01);
      transition: transform .25s ease, filter .25s ease;
      filter: saturate(1.02) contrast(1.02);
    }
    .card:hover .img-box img { transform: scale(1.05); }

    .card-info {
      padding: 13px 14px 14px;
      text-align: center;
    }
    .card-info small {
      display: block;
      color: var(--pm-red);
      font-family: monospace;
      font-size: 0.82rem;
      margin-bottom: 5px;
      letter-spacing: 0.04em;
    }
    .card-info h3 {
      margin: 0;
      color: #fff;
      font-size: 1.03rem;
      line-height: 1.2;
    }
    .card-info p {
      margin: 7px 0 0;
      color: var(--pm-muted);
      font-size: 0.88rem;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty {
      max-width: var(--max);
      margin: 24px auto 0;
      padding: 18px 16px 40px;
      color: var(--pm-muted);
      text-align: center;
      font-family: monospace;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(7px);
      padding: 14px;
    }
    .modal.open { display: block; }
    .modal-content {
      width: min(100%, 980px);
      height: min(100%, 92vh);
      margin: 0 auto;
      background: linear-gradient(180deg, #101010, #0b0b0b);
      border: 1px solid rgba(255,59,59,0.72);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,0.6);
      display: grid;
      grid-template-rows: auto auto 1fr;
    }
    .close {
      position: absolute;
      top: 10px;
      right: 16px;
      font-size: 34px;
      color: #fff;
      cursor: pointer;
      z-index: 3;
      line-height: 1;
      user-select: none;
    }
    .modal-header {
      position: relative;
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      align-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #181818, #121212);
      border-bottom: 1px solid #2a2a2a;
    }
    #modalImg {
      width: 170px;
      max-width: 40vw;
      aspect-ratio: 1 / 1.2;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid rgba(212,175,55,0.65);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03);
      background: #060606;
    }
    .header-info h2 {
      margin: 0;
      color: var(--pm-gold);
      font-size: clamp(1.5rem, 4vw, 2.35rem);
      line-height: 1.15;
    }
    .header-info p {
      margin: 10px 0 0;
      color: var(--pm-red);
      font-weight: 700;
      line-height: 1.5;
      font-family: monospace;
    }

    .modal-tabs {
      display: flex;
      background: #090909;
      border-bottom: 1px solid #2a2a2a;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .tab-btn {
      flex: 1 0 0;
      min-width: 140px;
      border: none;
      border-radius: 0;
      padding: 14px 16px;
      color: #9a9a9a;
      background: transparent;
      border-right: 1px solid #1f1f1f;
      font-size: 0.98rem;
    }
    .tab-btn:hover { transform: none; box-shadow: none; }
    .tab-btn.active {
      color: var(--pm-red);
      background: #111111;
      border-bottom: 3px solid var(--pm-red);
    }
    .modal-body {
      padding: 22px 24px 30px;
      line-height: 1.9;
      color: #d2d2d2;
      font-size: 1rem;
      overflow: auto;
      white-space: pre-wrap;
    }
    .modal-body h3 {
      margin: 0 0 8px;
      color: #fff;
    }
    .modal-body .meta {
      display: inline-block;
      margin: 0 0 14px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,59,59,0.1);
      color: #ff8d8d;
      font-size: 0.84rem;
      font-family: monospace;
    }
    .modal-body .section {
      background: rgba(255,255,255,0.02);
      border: 1px solid #232323;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .modal-body ul {
      margin: 10px 0 0 18px;
      padding: 0;
    }
    .modal-body li { margin: 4px 0; }

    .footer-note {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 16px 28px;
      color: #787878;
      font-size: 0.88rem;
      text-align: center;
      font-family: monospace;
    }

    @media (max-width: 720px) {
      .header-inner { padding: 16px 12px 14px; }
      .brand-row { align-items: flex-start; }
      .game-nav, .sub-nav { justify-content: flex-start; overflow-x: auto; padding-bottom: 4px; flex-wrap: nowrap; }
      .game-nav::-webkit-scrollbar, .sub-nav::-webkit-scrollbar, .modal-tabs::-webkit-scrollbar { height: 6px; }
      .game-nav::-webkit-scrollbar-thumb, .sub-nav::-webkit-scrollbar-thumb, .modal-tabs::-webkit-scrollbar-thumb { background: #333; border-radius: 999px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 18px 12px 34px; }
      .card-info { padding: 11px 10px 12px; }
      .card-info h3 { font-size: 0.96rem; }
      .modal { padding: 0; }
      .modal-content { width: 100%; height: 100%; border-radius: 0; }
      .modal-header { padding: 18px 14px; gap: 16px; }
      #modalImg { width: 120px; }
      .modal-body { padding: 18px 14px 24px; font-size: 0.98rem; }
      .tab-btn { min-width: 120px; padding: 13px 10px; }
      .close { top: 8px; right: 12px; font-size: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading" aria-hidden="true">
    <div class="loading-card">
      <h1 class="loading-title">PROJECT MOON ARCHIVE</h1>
      <p class="loading-sub" id="loadingText">Synchronizing data...</p>
      <div class="scanbar" aria-hidden="true"><span></span></div>
    </div>
  </div>

  <div class="app">
    <header>
      <div class="header-inner">
        <div class="brand-row">
          <div class="logo">PROJECT MOON ARCHIVE</div>
          <div class="subtitle">Library / Corp / Company unified archive</div>
        </div>

        <div class="game-nav" id="gameNav"></div>
        <div class="sub-nav" id="subnav"></div>

        <div class="search-row">
          <div class="search-wrap">
            <input id="search" type="text" placeholder="> 輸入名稱、編號、身分關鍵字..." />
          </div>
        </div>
      </div>
    </header>

    <main id="dataGrid" class="grid"></main>
    <div id="emptyState" class="empty" style="display:none;">沒有符合條件的資料。</div>

    <div id="detailModal" class="modal" aria-hidden="true">
      <div class="modal-content">
        <span class="close" onclick="closeM()" aria-label="關閉">&times;</span>
        <div class="modal-header">
          <img id="modalImg" src="" alt="Portrait" referrerpolicy="no-referrer" />
          <div class="header-info">
            <h2 id="modalTitle"></h2>
            <p id="modalTag"></p>
          </div>
        </div>
        <div class="modal-tabs">
          <button class="tab-btn active" onclick="setT('intro', this)">檔案介紹</button>
          <button class="tab-btn" onclick="setT('bg', this)">背景故事</button>
          <button class="tab-btn" onclick="setT('story', this)">章節紀錄</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>

    <div class="footer-note">GitHub Pages compatible · single-file build · no dependency required</div>
  </div>

  <script>
    const WIKI = {
      Limbus: "https://limbuscompany.wiki.gg/wiki/Special:FilePath/",
      Ruina: "https://libraryofruina.wiki.gg/wiki/Special:FilePath/",
      Lobotomy: "https://lobotomycorp.wiki.gg/wiki/Special:FilePath/"
    };

    const DB = {
      Limbus: {
        cats: {
          sinners: {
            label: "12 罪人",
            items: [
              { id: "01", name: "Yi Sang 易桑", tag: "No. 01 / 詩人與觀察者", files: ["Yi Sang Portrait.png", "Yi_Sang_Portrait.png", "Yi Sang.png"], intro: "前九人會成員，擅長鏡像與理論思考。", bg: "他總在碎裂的現實裡尋找秩序與自我，語氣溫和，內在卻極其敏銳。", story: "第四章聚焦其價值觀的重整，從自我否定走向重新定義『飛翔』的可能。" },
              { id: "02", name: "Faust 浮士德", tag: "No. 02 / 全知傾向", files: ["Faust Portrait.png", "Faust_Portrait.png", "Faust.png"], intro: "自稱最接近全知的天才。", bg: "話語克制而精準，對資訊與結論的渴求近乎偏執。", story: "在多個章節中扮演隱性解說者與推進者。" },
              { id: "03", name: "Don Quixote 唐吉訶德", tag: "No. 03 / 正義狂熱者", files: ["Don Quixote Portrait.png", "Don_Quixote_Portrait.png", "Don Quixote.png"], intro: "熱衷正義與浪漫的少女。", bg: "她的言行充滿誇張的俠義感，背後藏著對世界的誤讀與執念。", story: "第七章將她的信念與真相正面碰撞。" },
              { id: "04", name: "Ryoshu 龍州", tag: "No. 04 / 刀與美學", files: ["Ryoshu Portrait.png", "Ryoshu_Portrait.png", "Ryoshu.png"], intro: "以暴烈方式詮釋美感。", bg: "她對『作品』的執著極端而純粹，常以冷酷口吻切開事物的本質。", story: "多次作為戰鬥爆點與風格化敘事的中心。" },
              { id: "05", name: "Meursault 梅爾索", tag: "No. 05 / 理性執行者", files: ["Meursault Portrait.png", "Meursault_Portrait.png", "Meursault.png"], intro: "遵循程序與結果的行動者。", bg: "他的沉默不是空白，而是把主觀情緒徹底壓縮後的狀態。", story: "常在任務與價值衝突之中維持冰冷的執行。" },
              { id: "06", name: "Hong Lu 洪路", tag: "No. 06 / 天真貴公子", files: ["Hong Lu Portrait.png", "Hong_Lu_Portrait.png", "Hong Lu.png"], intro: "以輕鬆語氣看待殘酷現實。", bg: "他的『不在乎』往往像是一層保護性的距離感。", story: "在故事中常作為氣氛緩衝與異質視角。" },
              { id: "07", name: "Heathcliff 希斯克里夫", tag: "No. 07 / 憤怒與反抗", files: ["Heathcliff Portrait.png", "Heathcliff_Portrait.png", "Heathcliff.png"], intro: "衝動、直接、情緒化。", bg: "長期被剝奪與輕視的經驗，使他的防禦幾乎全都以怒意表現。", story: "第六章是他最完整的情感展開之一。" },
              { id: "08", name: "Ishmael 以實瑪利", tag: "No. 08 / 追逐白鯨者", files: ["Ishmael Portrait.png", "Ishmael_Portrait.png", "Ishmael.png"], intro: "理性外殼下藏著執著。", bg: "她不是單純在追目標，而是在追逐一段無法放下的經歷。", story: "第五章為其內在焦慮與執念提供主軸。" },
              { id: "09", name: "Rodion 羅德昂", tag: "No. 09 / 熱情賭徒", files: ["Rodion Portrait.png", "Rodion_Portrait.png", "Rodion.png"], intro: "擅長用輕鬆感掩飾沉重。", bg: "她的熱情、玩笑與行動力，常是對不安的反射性反應。", story: "在多段劇情裡以社交張力與道德困境呈現層次。" },
              { id: "10", name: "Sinclair 辛克萊", tag: "No. 10 / 破碎成長", files: ["Sinclair Portrait.png", "Sinclair_Portrait.png", "Sinclair.png"], intro: "敏感、壓抑、容易被牽動。", bg: "他在壓力下逐步建立自己的行動邏輯，從被動走向主動。", story: "第三章是其核心轉折。" },
              { id: "11", name: "Outis 奧緹斯", tag: "No. 11 / 戰術官", files: ["Outis Portrait.png", "Outis_Portrait.png", "Outis.png"], intro: "講究效率與紀律。", bg: "她的每一句話幾乎都像命令，時常將團隊拉回任務本身。", story: "在戰術與服從的框架下逐漸顯露個人輪廓。" },

    const state = {
      game: "Limbus",
      cat: "sinners",
      item: null,
      tab: "intro"
    };

    const gameNav = document.getElementById("gameNav");
    const subnav = document.getElementById("subnav");
    const grid = document.getElementById("dataGrid");
    const search = document.getElementById("search");
    const emptyState = document.getElementById("emptyState");
    const modal = document.getElementById("detailModal");
    const modalImg = document.getElementById("modalImg");
    const modalTitle = document.getElementById("modalTitle");
    const modalTag = document.getElementById("modalTag");
    const modalBody = document.getElementById("modalBody");

    function makeDataUriPlaceholder(label) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360">
          <defs>
            <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#1d1d1d"/>
              <stop offset="100%" stop-color="#090909"/>
            </linearGradient>
          </defs>
          <rect width="300" height="360" fill="url(#g)"/>
          <rect x="14" y="14" width="272" height="332" rx="16" fill="none" stroke="#ff3b3b" stroke-opacity="0.35"/>
          <text x="50%" y="45%" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="28" fill="#d4af37" font-weight="700">${label}</text>
          <text x="50%" y="57%" text-anchor="middle" font-family="monospace" font-size="12" fill="#a7a7a7">IMAGE NOT FOUND</text>
        </svg>`;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    function getCandidates(item) {
      const wikiRoot = WIKI[state.game];
      const normalized = item.files || [];
      return normalized.map(f => wikiRoot + encodeURIComponent(f));
    }

    function attachFallback(imgEl, item) {
      const candidates = getCandidates(item);
      let idx = 0;
      const fallback = makeDataUriPlaceholder(item.name);

      const tryNext = () => {
        if (idx < candidates.length) {
          imgEl.src = candidates[idx++];
        } else {
          imgEl.src = fallback;
        }
      };

      imgEl.onerror = () => {
        imgEl.onerror = null;
        tryNext();
        imgEl.onerror = () => {
          imgEl.onerror = null;
          imgEl.src = fallback;
        };
      };

      tryNext();
    }

    function renderGameNav() {
      const games = [
        ["Limbus", "LIMBUS COMPANY"],
        ["Ruina", "LIBRARY OF RUINA"],
        ["Lobotomy", "LOBOTOMY CORP"]
      ];
      gameNav.innerHTML = "";
      games.forEach(([id, label]) => {
        const btn = document.createElement("button");
        btn.className = `g-btn${state.game === id ? " active" : ""}`;
        btn.textContent = label;
        btn.onclick = () => switchGame(id);
        gameNav.appendChild(btn);
      });
    }

    function renderSubnav() {
      subnav.innerHTML = "";
      const cats = DB[state.game].cats;
      const keys = Object.keys(cats);
      if (!cats[state.cat]) state.cat = keys[0];
      keys.forEach((key) => {
        const btn = document.createElement("button");
        btn.className = state.cat === key ? "active" : "";
        btn.textContent = cats[key].label;
        btn.onclick = () => { state.cat = key; render(); renderSubnav(); };
        subnav.appendChild(btn);
      });
    }

    function switchGame(id) {
      state.game = id;
      state.cat = Object.keys(DB[id].cats)[0];
      renderGameNav();
      renderSubnav();
      render();
    }

    function createCard(item) {
      const card = document.createElement("article");
      card.className = "card";
      card.tabIndex = 0;
      card.addEventListener("click", () => openModal(item));
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openModal(item);
        }
      });

      const imgBox = document.createElement("div");
      imgBox.className = "img-box";
      const img = document.createElement("img");
      img.loading = "lazy";
      img.alt = item.name;
      img.referrerPolicy = "no-referrer";
      attachFallback(img, item);
      imgBox.appendChild(img);

      const info = document.createElement("div");
      info.className = "card-info";
      const small = document.createElement("small");
      small.textContent = item.tag;
      const h3 = document.createElement("h3");
      h3.textContent = item.name;
      const p = document.createElement("p");
      p.textContent = item.intro;
      info.append(small, h3, p);

      card.append(imgBox, info);
      return card;
    }

    function render() {
      const q = search.value.trim().toLowerCase();
      const items = DB[state.game].cats[state.cat].items.filter(item => {
        return [item.name, item.tag, item.id, item.intro, item.bg, item.story].join(" ").toLowerCase().includes(q);
      });

      grid.innerHTML = "";
      items.forEach(item => grid.appendChild(createCard(item)));
      emptyState.style.display = items.length ? "none" : "block";
    }

    function buildModalBody(item, tab) {
      if (tab === "intro") {
        return `
          <div class="section">
            <div class="meta">${item.tag}</div>
            <h3>檔案介紹</h3>
            <div>${item.intro}</div>
          </div>
        `;
      }
      if (tab === "bg") {
        return `
          <div class="section">
            <div class="meta">背景資料</div>
            <h3>背景故事</h3>
            <div>${item.bg}</div>
          </div>
        `;
      }
      return `
        <div class="section">
          <div class="meta">章節紀錄</div>
          <h3>敘事節點</h3>
          <div>${item.story}</div>
        </div>
      `;
    }

    function openModal(item) {
      state.item = item;
      state.tab = "intro";
      modalTitle.textContent = item.name;
      modalTag.textContent = item.tag;
      modalImg.alt = item.name;
      modalImg.src = "";
      attachFallback(modalImg, item);
      modalBody.innerHTML = buildModalBody(item, state.tab);
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      document.querySelector(".tab-btn").classList.add("active");
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeM() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function setT(type, btn) {
      if (!state.item) return;
      state.tab = type;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      modalBody.innerHTML = buildModalBody(state.item, type);
    }

    search.addEventListener("input", render);
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeM();
    });
    window.addEventListener("click", (e) => {
      if (e.target === modal) closeM();
    });

    window.addEventListener("load", () => {
      renderGameNav();
      renderSubnav();
      render();
      setTimeout(() => document.getElementById("loading").classList.add("hide"), 600);
    });
  </script>
