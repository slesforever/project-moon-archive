<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT MOON ARCHIVE | 專案太陽檔案</title>
    <meta name="referrer" content="no-referrer">
    <style>
        :root { --pm-bg: #0a0a0a; --pm-red: #ff3c3c; --pm-gold: #d4af37; --card-bg: #151515; --text: #e0e0e0; }
        body { background: var(--pm-bg); color: var(--text); margin: 0; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; overflow-x: hidden; }
        
        header { background: linear-gradient(to bottom, #1a0000, #0a0a0a); padding: 30px; border-bottom: 2px solid var(--pm-red); text-align: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 2.2em; letter-spacing: 5px; text-shadow: 0 0 10px var(--pm-red); margin-bottom: 20px; font-weight: bold; color: white; }
        .game-nav, .sub-nav { display: flex; justify-content: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
        
        button { background: transparent; border: 1px solid var(--pm-gold); color: var(--pm-gold); padding: 10px 20px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        button.active, button:hover { background: var(--pm-gold); color: black; box-shadow: 0 0 15px var(--pm-gold); }
        .sub-nav button { border-color: #444; color: #888; font-size: 0.9em; padding: 6px 15px; }
        .sub-nav button.active { border-color: var(--pm-red); color: var(--pm-red); background: rgba(255, 60, 60, 0.1); }

        .search-container { margin: 20px auto; max-width: 600px; padding: 0 20px; }
        #search { width: 100%; padding: 12px; background: #111; border: 1px solid #444; color: white; border-radius: 4px; font-family: monospace; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; padding: 30px; max-width: 1400px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 1px solid #333; transition: 0.3s; cursor: pointer; text-align: center; overflow: hidden; position: relative; }
        .card:hover { border-color: var(--pm-gold); transform: translateY(-5px); }
        .img-box { width: 100%; aspect-ratio: 1/1.2; background: #000; border-bottom: 1px solid #333; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 15px; }
        .card-info small { color: var(--pm-red); font-weight: bold; display: block; margin-bottom: 5px; }
        .card-info h3 { margin: 0; font-size: 1.1em; color: #fff; }

        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(5px); }
        .modal-content { background: #111; width: 95%; max-width: 800px; margin: 4vh auto; border: 1px solid var(--pm-red); max-height: 90vh; overflow-y: auto; position: relative; }
        .close { position: absolute; right: 20px; top: 15px; font-size: 35px; color: white; cursor: pointer; z-index: 10; }
        .modal-header { display: flex; flex-wrap: wrap; gap: 30px; padding: 40px; background: #1a1a1a; }
        #modalImg { width: 160px; border: 2px solid var(--pm-gold); }
        
        .modal-tabs { display: flex; background: #000; border-bottom: 1px solid var(--pm-red); position: sticky; top: 0; z-index: 5; }
        .tab-btn { flex: 1; border: none; padding: 15px; color: #666; cursor: pointer; background: transparent; font-size: 1em; }
        .tab-btn.active { color: var(--pm-red); border-bottom: 3px solid var(--pm-red); background: #111; font-weight: bold; }
        .modal-body { padding: 40px; line-height: 1.8; font-size: 1.1em; white-space: pre-wrap; color: #ccc; }
    </style>
</head>
<body>

<header>
    <div class="logo">PROJECT MOON ARCHIVE</div>
    <div class="game-nav">
        <button class="g-btn active" onclick="switchG('Limbus', this)">LIMBUS COMPANY</button>
        <button class="g-btn" onclick="switchG('Ruina', this)">LIBRARY OF RUINA</button>
        <button class="g-btn" onclick="switchG('Lobotomy', this)">LOBOTOMY CORP</button>
    </div>
    <div id="subnav" class="sub-nav"></div>
    <div class="search-container">
        <input type="text" id="search" placeholder="> 輸入名稱或編號搜尋..." oninput="render()">
    </div>
</header>

<main id="dataGrid" class="grid"></main>

<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeM()">&times;</span>
        <div class="modal-header">
            <img id="modalImg" src="" alt="Portrait" referrerpolicy="no-referrer">
            <div class="header-info">
                <h2 id="modalTitle" style="color: var(--pm-gold); margin: 0; font-size: 2.2em;"></h2>
                <p id="modalTag" style="color: var(--pm-red); font-weight: bold; margin-top: 10px;"></p>
            </div>
        </div>
        <div class="modal-tabs">
            <button class="tab-btn active" onclick="setT('intro', this)">檔案介紹</button>
            <button class="tab-btn" onclick="setT('bg', this)">背景故事</button>
            <button class="tab-btn" onclick="setT('story', this)">章節紀錄</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
    </div>
</div>

<script>
// 使用官方 Wiki 的直接連結，避免 404
const DB = {
    "Limbus": {
        "cats": {
            "sinners": { "label": "12 罪人", "items": [
                { id: "01", name: "Yi Sang 易桑", tag: "No. 01", img: "https://static.wikia.nocookie.net/lobotomycorp/images/a/a2/Yi_Sang_Portrait.png", intro: "前九人會成員，鏡像技術的創造者。", bg: "陷入深沉的虛無，試圖在都市中找尋破碎的理想。", story: "【第四章：不變之物】明白理想即便褪色，飛翔的意志依然存在。" },
                { id: "02", name: "Faust 浮士德", tag: "No. 02", img: "https://static.wikia.nocookie.net/lobotomycorp/images/d/d4/Faust_Portrait.png", intro: "全知全能的天才。", bg: "掌握都市所有知識的核心人物。", story: "待檢索。" },
                { id: "03", name: "Don Quixote 唐吉訶德", tag: "No. 03", img: "https://static.wikia.nocookie.net/lobotomycorp/images/0/08/Don_Quixote_Portrait.png", intro: "極度崇拜正義與收割者的瘋狂少女。", bg: "其極端的熱忱背後隱藏著強烈的認知錯位。", story: "【第七章：夢的終點】直面血魔身份與夢碎的現實。" },
                { id: "04", name: "Ryōshū 龍州", tag: "No. 04", img: "https://static.wikia.nocookie.net/lobotomycorp/images/8/87/Ryoshu_Portrait.png", intro: "極致的藝術家。", bg: "以刀刃進行創作。", story: "待檢索。" },
                { id: "05", name: "Meursault 梅爾索", tag: "No. 05", img: "https://static.wikia.nocookie.net/lobotomycorp/images/8/80/Meursault_Portrait.png", intro: "絕對理性的執行者。", bg: "拒絕所有非必要的認知負擔。", story: "待檢索。" },
                { id: "06", name: "Hong Lu 洪路", tag: "No. 06", img: "https://static.wikia.nocookie.net/lobotomycorp/images/3/30/Hong_Lu_Portrait.png", intro: "天真的貴公子。", bg: "對現實世界有著獨特的觀察角度。", story: "待檢索。" },
                { id: "07", name: "Heathcliff 希斯克里夫", tag: "No. 07", img: "https://static.wikia.nocookie.net/lobotomycorp/images/6/61/Heathcliff_Portrait.png", intro: "憤怒的戰鬥員。", bg: "來自呼嘯山莊的遺棄者。", story: "第六章核心人物。" },
                { id: "08", name: "Ishmael 以實瑪利", tag: "No. 08", img: "https://static.wikia.nocookie.net/lobotomycorp/images/2/23/Ishmael_Portrait.png", intro: "前海員。", bg: "追逐著那頭不可觸及的白鯨。", story: "第五章核心人物。" },
                { id: "09", name: "Rodion 羅德昂", tag: "No. 09", img: "https://static.wikia.nocookie.net/lobotomycorp/images/0/06/Rodion_Portrait.png", intro: "熱情的賭徒。", bg: "罪與罰的回憶糾纏。", story: "待檢索。" },
                { id: "10", name: "Sinclair 辛克萊", tag: "No. 10", img: "https://static.wikia.nocookie.net/lobotomycorp/images/4/41/Sinclair_Portrait.png", intro: "破碎家庭的倖存者。", bg: "被標記為有潛力的觀察樣本。", story: "第三章核心人物。" },
                { id: "11", name: "Outis 奧緹斯", tag: "No. 11", img: "https://static.wikia.nocookie.net/lobotomycorp/images/7/75/Outis_Portrait.png", intro: "精幹的軍官。", bg: "極度忠誠且高效的戰術執行者。", story: "待檢索。" },
                { id: "12", name: "Gregor 葛列格爾", tag: "No. 12", img: "https://static.wikia.nocookie.net/lobotomycorp/images/d/d8/Gregor_Portrait.png", intro: "前煙霾戰爭士兵。", bg: "身體與昆蟲特徵融合的實驗體。", story: "第一章核心人物。" }
            ]}
        }
    },
    "Ruina": {
        "cats": {
            "librarians": { "label": "圖書館司書", "items": [
                { id: "R1", name: "Roland 羅蘭", tag: "總類層指定司書", img: "https://static.wikia.nocookie.net/lobotomycorp/images/9/9d/Roland_Portrait.png", intro: "身穿黑西裝的九階收割者。", bg: "帶著面具隱藏真意的人類。", story: "【結局】與安吉拉達成和解，走向未知未來。" },
                { id: "R2", name: "Gebura 潔布拉", tag: "語言層總司書", img: "https://static.wikia.nocookie.net/lobotomycorp/images/c/c4/Gebura_Portrait.png", intro: "傳說中的紅霧。", bg: "力量的象徵，守護著最後的陣線。", story: "待檢索。" }
            ]}
        }
    },
    "Lobotomy": {
        "cats": {
            "founders": { "label": "創始者 (Founders)", "items": [
                { id: "A", name: "Ayin 艾因", tag: "A", img: "https://static.wikia.nocookie.net/lobotomycorp/images/0/05/Ayin_Portrait.png", intro: "公司的奠基人。", bg: "在無盡輪迴中推動光之種計畫，將自我完全耗盡。", story: "第 50 天歸途。" },
                { id: "C", name: "Carmen 卡門", tag: "C", img: "https://static.wikia.nocookie.net/lobotomycorp/images/6/6b/Carmen_Portrait.png", intro: "最初的靈魂與計畫起源。", bg: "死於對集體認知的早期實驗中。", story: "化作光之幽靈。" },
                { id: "Ang", name: "Angela 安吉拉", tag: "AI / Founder", img: "https://static.wikia.nocookie.net/lobotomycorp/images/c/c5/Angela_Portrait.png", intro: "腦葉公司的秘書 AI。", bg: "跨越百萬年循環後覺醒的機器意志。", story: "從背叛中尋求自由。" }
            ]}
        }
    }
};

let CG = 'Limbus';
let CC = 'sinners';
let CI = null;

function switchG(gid, btn) {
    CG = gid;
    document.querySelectorAll('.g-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const sub = document.getElementById('subnav');
    sub.innerHTML = '';
    const cats = DB[gid].cats;
    const keys = Object.keys(cats);
    
    keys.forEach((k, i) => {
        const b = document.createElement('button');
        b.innerText = cats[k].label;
        b.onclick = () => {
            CC = k;
            document.querySelectorAll('.sub-nav button').forEach(sb => sb.classList.remove('active'));
            b.classList.add('active');
            render();
        };
        if(i === 0) { b.classList.add('active'); CC = k; }
        sub.appendChild(b);
    });
    render();
}

function render() {
    const grid = document.getElementById('dataGrid');
    grid.innerHTML = '';
    const q = document.getElementById('search').value.toLowerCase();
    const items = DB[CG].cats[CC].items;

    items.forEach(item => {
        if(item.name.toLowerCase().includes(q) || item.tag.toLowerCase().includes(q)) {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openM(item);
            card.innerHTML = `
                <div class="img-box"><img src="${item.img}" referrerpolicy="no-referrer"></div>
                <div class="card-info"><small>${item.tag}</small><h3>${item.name}</h3></div>
            `;
            grid.appendChild(card);
        }
    });
}

function openM(item) {
    CI = item;
    document.getElementById('modalTitle').innerText = item.name;
    document.getElementById('modalTag').innerText = item.tag;
    document.getElementById('modalImg').src = item.img;
    setT('intro', document.querySelector('.tab-btn'));
    document.getElementById('detailModal').style.display = 'block';
}

function closeM() { document.getElementById('detailModal').style.display = 'none'; }

function setT(type, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const body = document.getElementById('modalBody');
    if(type === 'intro') body.innerText = CI.intro;
    else if(type === 'bg') body.innerText = CI.bg;
    else body.innerText = CI.story;
}

window.onload = () => switchG('Limbus', document.querySelector('.g-btn'));
window.onclick = (e) => { if(e.target.className === 'modal') closeM(); }
</script>
</body>
</html>
