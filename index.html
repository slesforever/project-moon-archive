<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT MOON ARCHIVE | 都市檔案館</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>PROJECT MOON ARCHIVE</h1>
        <div class="game-selector">
            <button class="game-btn active" data-game="LimbusCompany">LIMBUS COMPANY</button>
            <button class="game-btn" data-game="LibraryOfRuina">LIBRARY OF RUINA</button>
            <button class="game-btn" data-game="LobotomyCorp">LOBOTOMY CORP</button>
        </div>
    </header>

    <nav id="subnav"></nav>

    <div class="search-area">
        <input type="text" id="search" placeholder="> 檢索目前分區之資料...">
    </div>

    <main class="container" id="dataGrid"></main>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="modal-body">
                <div class="modal-image-container">
                    <img id="modalImg" src="" alt="">
                </div>
                <div class="modal-text-container">
                    <h2 id="modalTitle"></h2>
                    <div class="modal-tabs">
                        <button id="tabDetailsBtn" class="tab-btn active">詳細介紹</button>
                        <button id="tabStoryBtn" class="tab-btn">背景故事</button>
                    </div>
                    <div id="tabContent" class="tab-display"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
