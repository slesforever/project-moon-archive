<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT MOON ARCHIVE</title>
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">PROJECT MOON ARCHIVE</div>
        <div class="game-nav">
            <button class="game-btn active" data-game="LimbusCompany">LIMBUS COMPANY</button>
            <button class="game-btn" data-game="LibraryOfRuina">LIBRARY OF RUINA</button>
            <button class="game-btn" data-game="LobotomyCorp">LOBOTOMY CORP</button>
        </div>
        <div class="sub-nav-container">
            <div id="subnav" class="sub-nav"></div>
        </div>
        <div class="search-bar">
            <input type="text" id="search" placeholder="搜尋檔案名稱...">
        </div>
    </header>

    <main id="dataGrid" class="grid-container"></main>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <img id="modalImg" src="" alt="Portrait">
                <div class="header-info">
                    <h2 id="modalTitle"></h2>
                    <p id="modalTag"></p>
                </div>
            </div>
            <div class="modal-tabs">
                <button class="tab-btn active" id="btnDetails" onclick="setTab('details')">檔案介紹</button>
                <button class="tab-btn" id="btnStory" onclick="setTab('story')">個人背景</button>
                <button class="tab-btn" id="btnChapter" onclick="setTab('chapter')">章節/紀錄</button>
            </div>
            <div class="modal-body">
                <div id="modalBodyText" class="story-content"></div>
            </div>
        </div>
    </div>

    <script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
