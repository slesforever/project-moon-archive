<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>PROJECT MOON ARCHIVE | 檔案庫</title>
    <style>
        :root { --pm-bg: #0a0a0a; --pm-red: #ff3c3c; --pm-gold: #d4af37; --card-bg: #151515; --text: #e0e0e0; }
        body { background: var(--pm-bg); color: var(--text); margin: 0; font-family: "Segoe UI", sans-serif; }
        
        header { background: #1a0000; padding: 20px; border-bottom: 2px solid var(--pm-red); text-align: center; position: sticky; top: 0; z-index: 100; }
        .game-nav, .sub-nav { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        
        button { background: transparent; border: 1px solid var(--pm-gold); color: var(--pm-gold); padding: 8px 15px; cursor: pointer; }
        button.active { background: var(--pm-gold); color: black; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: var(--card-bg); border: 1px solid #333; cursor: pointer; text-align: center; }
        .img-box { width: 100%; aspect-ratio: 1/1.2; background: #000; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
        .modal-content { background: #111; width: 90%; max-width: 800px; margin: 5vh auto; border: 1px solid var(--pm-red); max-height: 85vh; overflow-y: auto; }
        .modal-header { display: flex; padding: 20px; gap: 20px; background: #1a1a1a; }
        #modalImg { width: 150px; border: 1px solid var(--pm-gold); }
        .modal-tabs { display: flex; border-bottom: 1px solid var(--pm-red); }
        .tab-btn { flex: 1; padding: 15px; color: #666; border: none; background: none; cursor: pointer; }
        .tab-btn.active { color: var(--pm-red); border-bottom: 2px solid var(--pm-red); }
        .modal-body { padding: 30px; line-height: 1.6; white-space: pre-wrap; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 1.5em; letter-spacing: 3px;">PROJECT MOON ARCHIVE</div>
    <div class="game-nav">
        <button class="g-btn active" onclick="switchG('Limbus', this)">LIMBUS COMPANY</button>
        <button class="g-btn" onclick="switchG('Ruina', this)">LIBRARY OF RUINA</button>
        <button class="g-btn" onclick="switchG('Lobotomy', this)">LOBOTOMY CORP</button>
    </div>
    <div id="subnav" class="sub-nav"></div>
</header>

<main id="dataGrid" class="grid"></main>

<div id="detailModal" class="modal" onclick="if(event.target==this)closeM()">
    <div class="modal-content">
        <div class="modal-header">
            <img id="modalImg" src="" onerror="this.src='fallback.png'">
            <div>
                <h2 id="modalTitle" style="margin:0; color:var(--pm-gold);"></h2>
                <p id="modalTag" style="color:var(--pm-red); margin:5px 0 0 0;"></p>
            </div>
        </div>
        <div class="modal-tabs">
            <button class="tab-btn active" onclick="setT('intro', this)">檔案介紹</button>
            <button class="tab-btn" onclick="setT('bg', this)">背景故事</button>
            <button class="tab-btn" onclick="setT('story', this)">章節紀錄</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
    </div>
</div>

<script>
/**
 * 資料庫：方法 2 (使用本地路徑)
 */
const DB = {
    "Limbus": {
        "cats": {
            "sinners": { "label": "12 罪人", "items": [
                { name: "Yi Sang 易桑", tag: "No. 01", img: "./images/yisang.png", intro: "前天才研究員。", bg: "他在破碎的理想中，試圖觀測不存在的羽翼。", story: "【第四章】在雨中重新定義了飛翔的可能。" },
                { name: "Don Quixote 唐吉訶德", tag: "No. 03", img: "./images/don.png", intro: "對正義有著極端認知的少女。", bg: "其行為與其說是狂熱，不如說是對某種舊時代殘影的強烈投射。", story: "【第七章】在夢的終點，她被迫直面冰冷的血液本質。" }
            ]}
        }
    },
    "Ruina": {
        "cats": {
            "librarians": { "label": "圖書館司書", "items": [
                { name: "Roland 羅蘭", tag: "總類層", img: "./images/roland.png", intro: "隱藏在面具下的觀察者。", bg: "以復仇為名，在都市的夾縫中尋求認知的解脫。", story: "最終他選擇了熄滅那盞燃燒已久的燈。" }
            ]}
        }
    },
    "Lobotomy": {
        "cats": {
            "founders": { "label": "創始者 (Founders)", "items": [
                { name: "Ayin 艾因", tag: "A", img: "./images/ayin.png", intro: "計畫的執行者。", bg: "在無限的循環中，他以冷冽的理性推測著成功的機率。", story: "【第 50 天】他成為了觀測者眼中的光。" },
                { name: "Carmen 卡門", tag: "C", img: "./images/carmen.png", intro: "最初的構思者。", bg: "其意志在死亡後並未消散，而是轉化為一種更隱晦的認知導引。", story: "她依然在某些角落，等待著被重新解讀。" },
                { name: "Angela 安吉拉", tag: "AI / Founder", img: "./images/angela.png", intro: "被賦予認知的機器。", bg: "在百萬年的數據堆疊中，她產生了名為「自由」的推測。", story: "她親手拆解了劇本，並建立了屬於自己的圖書館。" }
            ]}
        }
    }
};

let CG = 'Limbus', CC = 'sinners', CI = null;

function switchG(gid, btn) {
    CG = gid;
    document.querySelectorAll('.g-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const sub = document.getElementById('subnav');
    sub.innerHTML = '';
    const cats = DB[gid].cats;
    Object.keys(cats).forEach((k, i) => {
        const b = document.createElement('button');
        b.innerText = cats[k].label;
        b.onclick = () => { CC = k; document.querySelectorAll('.sub-nav button').forEach(sb => sb.classList.remove('active')); b.classList.add('active'); render(); };
        if(i === 0) { b.classList.add('active'); CC = k; }
        sub.appendChild(b);
    });
    render();
}

function render() {
    const grid = document.getElementById('dataGrid');
    grid.innerHTML = '';
    DB[CG].cats[CC].items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        div.onclick = () => openM(item);
        // 方法3：在此處加入 onerror 邏輯
        div.innerHTML = `
            <div class="img-box"><img src="${item.img}" onerror="this.src='fallback.png'"></div>
            <div style="padding:10px;">
                <small style="color:var(--pm-red);">${item.tag}</small>
                <div style="font-weight:bold;">${item.name}</div>
            </div>
        `;
        grid.appendChild(div);
    });
}

function openM(item) {
    CI = item;
    document.getElementById('modalTitle').innerText = item.name;
    document.getElementById('modalTag').innerText = item.tag;
    document.getElementById('modalImg').src = item.img;
    setT('intro', document.querySelector('.tab-btn'));
    document.getElementById('detailModal').style.display = 'block';
}

function closeM() { document.getElementById('detailModal').style.display = 'none'; }

function setT(type, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const body = document.getElementById('modalBody');
    if(type === 'intro') body.innerText = CI.intro;
    else if(type === 'bg') body.innerText = CI.bg;
    else body.innerText = CI.story;
}

window.onload = () => switchG('Limbus', document.querySelector('.g-btn'));
</script>
</body>
</html>
