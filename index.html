<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT MOON ARCHIVE | 月球計畫檔案</title>
    <meta name="referrer" content="no-referrer">
    <style>
        :root { --pm-bg: #0a0a0a; --pm-red: #ff3c3c; --pm-gold: #d4af37; --card-bg: #151515; --text: #e0e0e0; }
        body { background: var(--pm-bg); color: var(--text); margin: 0; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; }
        
        /* 頂部區域 */
        header { background: linear-gradient(to bottom, #1a0000, #0a0a0a); padding: 30px; border-bottom: 2px solid var(--pm-red); text-align: center; }
        .logo { font-size: 2.2em; letter-spacing: 5px; text-shadow: 0 0 10px var(--pm-red); margin-bottom: 20px; font-weight: bold; }
        
        /* 導航鈕 */
        .game-nav, .sub-nav { display: flex; justify-content: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
        button { background: transparent; border: 1px solid var(--pm-gold); color: var(--pm-gold); padding: 10px 20px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        button.active, button:hover { background: var(--pm-gold); color: black; box-shadow: 0 0 15px var(--pm-gold); }
        .sub-nav button { border-color: #444; color: #888; font-size: 0.9em; }
        .sub-nav button.active { border-color: var(--pm-red); color: var(--pm-red); background: rgba(255, 60, 60, 0.1); }

        /* 搜尋 */
        .search-container { margin: 20px auto; max-width: 500px; padding: 0 20px; }
        #search { width: 100%; padding: 12px; background: #111; border: 1px solid #444; color: white; border-radius: 4px; }

        /* 卡片網格 */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 40px; max-width: 1400px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 1px solid #333; transition: 0.3s; cursor: pointer; text-align: center; overflow: hidden; }
        .card:hover { border-color: var(--pm-gold); transform: translateY(-5px); }
        .img-box { width: 100%; aspect-ratio: 1/1.2; background: #000; border-bottom: 1px solid #333; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 15px; }
        .card-info small { color: var(--pm-red); font-weight: bold; }
        .card-info h3 { margin: 5px 0 0; font-size: 1.1em; }

        /* 彈窗 (Modal) */
        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); }
        .modal-content { background: #111; width: 90%; max-width: 850px; margin: 5vh auto; border: 1px solid var(--pm-red); max-height: 85vh; overflow-y: auto; position: relative; }
        .close { position: absolute; right: 20px; top: 15px; font-size: 35px; color: white; cursor: pointer; z-index: 10; }
        .modal-header { display: flex; flex-wrap: wrap; gap: 30px; padding: 40px; background: #1a1a1a; }
        #modalImg { width: 180px; border: 2px solid var(--pm-gold); }
        .modal-tabs { display: flex; background: #000; border-bottom: 1px solid var(--pm-red); position: sticky; top: 0; }
        .tab-btn { flex: 1; border: none; padding: 15px; color: #666; cursor: pointer; background: transparent; font-size: 1em; }
        .tab-btn.active { color: var(--pm-red); border-bottom: 3px solid var(--pm-red); background: #111; font-weight: bold; }
        .modal-body { padding: 40px; line-height: 1.8; font-size: 1.1em; white-space: pre-wrap; color: #ccc; }
    </style>
</head>
<body>

<header>
    <div class="logo">PROJECT MOON ARCHIVE</div>
    <div class="game-nav">
        <button class="g-btn active" onclick="switchG('Limbus', this)">LIMBUS COMPANY</button>
        <button class="g-btn" onclick="switchG('Ruina', this)">LIBRARY OF RUINA</button>
        <button class="g-btn" onclick="switchG('Lobotomy', this)">LOBOTOMY CORP</button>
    </div>
    <div id="subnav" class="sub-nav"></div>
    <div class="search-container">
        <input type="text" id="search" placeholder="> 搜尋檔案..." oninput="render()">
    </div>
</header>

<main id="dataGrid" class="grid"></main>

<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeM()">&times;</span>
        <div class="modal-header">
            <img id="modalImg" src="">
            <div class="header-info">
                <h2 id="modalTitle" style="color: var(--pm-gold); font-size: 2.5em; margin: 0;"></h2>
                <p id="modalTag" style="color: var(--pm-red); font-weight: bold; margin-top: 10px;"></p>
            </div>
        </div>
        <div class="modal-tabs">
            <button class="tab-btn active" onclick="setT('intro', this)">檔案介紹</button>
            <button class="tab-btn" onclick="setT('bg', this)">背景故事</button>
            <button class="tab-btn" onclick="setT('chap', this)">章節故事</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
    </div>
</div>

<script>
// --- 絕對正確的資料庫 (手動提取 Wiki 連結) ---
const DB = {
    "Limbus": {
        "cats": {
            "sinners": { "label": "12 罪人", "items": [
                { 
                    name: "Don Quixote 唐吉訶德", tag: "No. 03", 
                    img: "https://static.wikia.nocookie.net/lobotomycorp/images/0/08/Don_Quixote_Portrait.png",
                    intro: "邊獄公司 3 號收割者。一名極度崇拜「正義」與收割者的狂熱少女。",
                    bg: "身穿布滿收割者周邊的服裝，隨時保持著極端高昂的情緒。雖然表現得像個瘋子，但其對正義的偏執背後隱藏著巨大的秘密。",
                    chap: "【第七章：夢的終點】\n真相揭曉：她是第二代血魔，曾試圖建立一個人類與血魔共存的「夢幻樂園」。最終在那場名為夢的終點中，她被迫直面現實的寒冷。"
                },
                { 
                    name: "Yi Sang 易桑", tag: "No. 01", 
                    img: "https://static.wikia.nocookie.net/lobotomycorp/images/a/a2/Yi_Sang_Portrait.png",
                    intro: "前天才研究員「九人會」成員，鏡像技術的發明者。",
                    bg: "在同伴分散、理想破碎後，他陷入了漫長的虛無與沉寂。加入邊獄公司是為了尋找他失落的翅膀。",
                    chap: "【第四章：不變之物】\n他在雨中與曾經的理想對質。最終明白理想即便會受損，飛翔的意志依然是永恆的。"
                },
                { name: "Faust 浮士德", tag: "No. 02", img: "https://static.wikia.nocookie.net/lobotomycorp/images/d/d4/Faust_Portrait.png", intro: "邊獄公司技術核心。", bg: "全知全能的天才。", chap: "掌握所有都市秘密的鑰匙。" }
            ]},
            "stages": { "label": "關鍵關卡", "items": [
                { name: "P-Corp 遊樂園", tag: "Chapter 7", img: "https://static.wikia.nocookie.net/lobotomycorp/images/c/c5/Angela_Portrait.png", intro: "第七章主要場景。", bg: "血魔與夢想交織的樂園。", chap: "夢想破滅的終點站。" }
            ]}
        }
    },
    "Ruina": {
        "cats": {
            "librarians": { "label": "各層總司書", "items": [
                { 
                    name: "Roland 羅蘭", tag: "總類層指定司書", 
                    img: "https://static.wikia.nocookie.net/lobotomycorp/images/9/9d/Roland_Portrait.png",
                    intro: "圖書館中唯一的人類司書，身穿黑色西裝的九階收割者。",
                    bg: "在失去摯愛的妻子後血洗都市。為了復仇進入圖書館，卻在與安吉拉的相處中產生了複雜的情感。",
                    chap: "【結局：再見，我的苦痛】\n羅蘭最終選擇了寬恕。他將安吉拉從永恆的循環中拉了出來，即便這意味著圖書館將迎來終結。"
                },
                { name: "Gebura 潔布拉", tag: "語言層總司書", img: "https://static.wikia.nocookie.net/lobotomycorp/images/c/c4/Gebura_Portrait.png", intro: "傳說中的「紅霧」。", bg: " Kali，為了守護同伴而戰死。", chap: "在圖書館中以戰鬥指導者的身份守護著大家。" }
            ]}
        }
    },
    "Lobotomy": {
        "cats": {
            "founders": { "label": "創始者與 AI", "items": [
                { 
                    name: "Ayin 艾因", tag: "A", 
                    img: "https://static.wikia.nocookie.net/lobotomycorp/images/0/05/Ayin_Portrait.png",
                    intro: "腦葉公司的創始人。",
                    bg: "為了完成卡門的願望，他在無限的循環中折磨自己與同伴，只為播下希望的種子。",
                    chap: "【第 50 天】\n他化作光芒灑向都市，完成了漫長的贖罪。"
                },
                { name: "Carmen 卡門", tag: "C", img: "https://static.wikia.nocookie.net/lobotomycorp/images/6/6b/Carmen_Portrait.png", intro: "計畫的靈魂人物。", bg: "最初的帶領者。", chap: "即便死後，她的思想仍影響著整個世界。" }
            ]},
            "abnormalities": { "label": "異想體", "items": [
                { name: "一無所有", tag: "ALEPH", img: "https://static.wikia.nocookie.net/lobotomycorp/images/b/bb/Nothing_There_Icon.png", intro: "極度危險的擬態異想體。", bg: "渴望人類的外殼。", chap: "「你好」、「我愛你」——它模仿著這些詞彙，同時將員工撕碎。" }
            ]}
        }
    }
};

let CG = 'Limbus';
let CC = 'sinners';
let CI = null;

function switchG(gid, btn) {
    CG = gid;
    document.querySelectorAll('.g-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const sub = document.getElementById('subnav');
    sub.innerHTML = '';
    const cats = DB[gid].cats;
    const keys = Object.keys(cats);
    
    keys.forEach((k, i) => {
        const b = document.createElement('button');
        b.innerText = cats[k].label;
        b.onclick = () => {
            CC = k;
            document.querySelectorAll('.sub-nav button').forEach(sb => sb.classList.remove('active'));
            b.classList.add('active');
            render();
        };
        if(i === 0) { b.classList.add('active'); CC = k; }
        sub.appendChild(b);
    });
    render();
}

function render() {
    const grid = document.getElementById('dataGrid');
    grid.innerHTML = '';
    const q = document.getElementById('search').value.toLowerCase();
    const items = DB[CG].cats[CC].items;

    items.forEach(item => {
        if(item.name.toLowerCase().includes(q)) {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openM(item);
            card.innerHTML = `
                <div class="img-box"><img src="${item.img}"></div>
                <div class="card-info"><small>${item.tag}</small><h3>${item.name}</h3></div>
            `;
            grid.appendChild(card);
        }
    });
}

function openM(item) {
    CI = item;
    document.getElementById('modalTitle').innerText = item.name;
    document.getElementById('modalTag').innerText = item.tag;
    document.getElementById('modalImg').src = item.img;
    setT('intro', document.querySelector('.tab-btn'));
    document.getElementById('detailModal').style.display = 'block';
}

function closeM() { document.getElementById('detailModal').style.display = 'none'; }

function setT(type, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const body = document.getElementById('modalBody');
    if(type === 'intro') body.innerText = CI.intro;
    else if(type === 'bg') body.innerText = CI.bg;
    else body.innerText = CI.chap;
}

window.onload = () => switchG('Limbus', document.querySelector('.g-btn'));
window.onclick = (e) => { if(e.target.className === 'modal') closeM(); }
</script>
</body>
</html>
