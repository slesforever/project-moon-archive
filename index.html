<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>PROJECT MOON ARCHIVE | 月亮計畫</title>
  <style>
    :root {
      --pm-bg: #090909;
      --pm-card: #151515;
      --pm-text: #e7e7e7;
      --pm-red: #ff3b3b;
      --pm-red-soft: rgba(255, 59, 59, 0.12);
      --pm-gold: #d4af37;
      --pm-border: #2e2e2e;
      --radius: 16px;
      --max: 1400px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, rgba(255, 59, 59, 0.09), transparent 28%), #070707;
      color: var(--pm-text);
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      overflow-x: hidden;
    }

    /* Loading 畫面 */
    .loading {
      position: fixed; inset: 0; z-index: 9999;
      display: grid; place-items: center;
      background: #050505; transition: 0.5s;
    }
    .loading.hide { opacity: 0; visibility: hidden; }
    .loading-title { font-size: 2.5rem; letter-spacing: 0.2em; color: #fff; text-shadow: 0 0 15px var(--pm-red); }

    /* Header & 搜尋框 */
    header { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(10px); background: rgba(10, 10, 10, 0.9); border-bottom: 1px solid var(--pm-red); }
    .header-inner { max-width: var(--max); margin: 0 auto; padding: 20px; }
    .logo { font-size: 1.8rem; letter-spacing: 0.2em; font-weight: 800; text-align: center; margin-bottom: 15px; }
    
    .search-container { max-width: 600px; margin: 0 auto 15px; position: relative; }
    .search-input {
      width: 100%; background: #000; border: 1px solid #333; color: white;
      padding: 12px 20px; border-radius: 8px; font-size: 1rem; transition: 0.3s;
    }
    .search-input:focus { border-color: var(--pm-gold); outline: none; box-shadow: 0 0 10px rgba(212,175,55,0.2); }

    .game-nav, .sub-nav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
    button {
      border: 1px solid var(--pm-gold); background: transparent; color: var(--pm-gold);
      padding: 8px 18px; border-radius: 999px; cursor: pointer; font-weight: 700; transition: 0.2s;
    }
    button.active { background: var(--pm-gold); color: #000; }
    .sub-nav button { border-color: #333; color: #888; }
    .sub-nav button.active { border-color: var(--pm-red); color: var(--pm-red); background: var(--pm-red-soft); }

    /* Grid */
    .grid { max-width: var(--max); margin: 0 auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
    .card { background: var(--pm-card); border: 1px solid var(--pm-border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: 0.3s; }
    .card:hover { transform: translateY(-5px); border-color: var(--pm-gold); }
    .img-box { width: 100%; aspect-ratio: 1/1.2; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { padding: 15px; text-align: center; }
    .card-info h3 { margin: 5px 0; font-size: 1rem; }
    .card-info small { color: var(--pm-red); font-family: monospace; font-size: 0.8rem; }

    /* Modal */
    .modal { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; backdrop-filter: blur(8px); }
    .modal.open { display: flex; }
    .modal-content { width: 90%; max-width: 850px; background: #0f0f0f; border: 1px solid var(--pm-red); border-radius: 20px; overflow: hidden; position: relative; }
    .close { position: absolute; top: 15px; right: 20px; font-size: 30px; cursor: pointer; color: #fff; z-index: 10; }
    .modal-header { display: flex; padding: 30px; gap: 25px; background: #151515; border-bottom: 1px solid #222; }
    #modalImg { width: 150px; height: 180px; object-fit: cover; border: 1px solid var(--pm-gold); border-radius: 10px; }
    .modal-tabs { display: flex; background: #0a0a0a; }
    .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: #666; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: var(--pm-red); border-bottom-color: var(--pm-red); background: #111; }
    .modal-body { padding: 30px; line-height: 1.8; color: #ccc; white-space: pre-wrap; height: 300px; overflow-y: auto; }
  </style>
</head>
<body>

  <div id="loading" class="loading">
    <h1 class="loading-title">PROJECT MOON ARCHIVE</h1>
  </div>

  <div class="app">
    <header>
      <div class="header-inner">
        <div class="logo">PROJECT MOON ARCHIVE</div>
        <div class="search-container">
          <input type="text" id="searchInput" class="search-input" placeholder="> 檢索關鍵字 (名稱/標號) . . .">
        </div>
        <div class="game-nav" id="gameNav"></div>
        <div class="sub-nav" id="subnav"></div>
      </div>
    </header>

    <main id="dataGrid" class="grid"></main>

    <div id="detailModal" class="modal" onclick="if(event.target==this)closeM()">
      <div class="modal-content">
        <span class="close" onclick="closeM()">&times;</span>
        <div class="modal-header">
          <img id="modalImg" src="" />
          <div class="header-info">
            <h2 id="modalTitle" style="color:var(--pm-gold); margin:0;"></h2>
            <p id="modalTag" style="color:var(--pm-red); font-family:monospace; margin:10px 0;"></p>
          </div>
        </div>
        <div class="modal-tabs">
          <button class="tab-btn active" onclick="setT('intro', this)">檔案介紹</button>
          <button class="tab-btn" onclick="setT('bg', this)">背景故事</button>
          <button class="tab-btn" onclick="setT('story', this)">章節紀錄</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>
  </div>

  <script>
    const LOCAL = { Limbus: "assets/img/limbus/", Ruina: "assets/img/ruina/", Lobotomy: "assets/img/lcorp/" };

    const DB = {
      Limbus: {
        cats: {
          core: { label: "引路人", items: [
            { name: "Dante 但丁", tag: "Manager / LCB", files: ["Dante.png"], intro: "邊獄公司的管理者，也是多項認知技術的載體。", bg: "以時鐘作為其具象化的認知介面。", story: "《Limbus Company》中的但丁（Dante）是LCB（Limbus Company Bus）的執行經理，頭部為鐘錶的失憶者。在尋找金枝以恢復記憶的過程中，他們與12名罪人簽訂契約，利用獨特能力使死亡的罪人回溯復活。但丁性格溫和、懦弱，與暴力罪人形成對比，其過去疑與「大人物」有關，受維吉里烏斯指導。" },
            { name: "Vergilius 維吉里烏斯", tag: "Guide / LCB", files: ["Vergilius.png"], intro: "Limbus Company 的引導者。", bg: "曾被稱為最不穩定的收割者之一。", story: "曾是實力頂尖的色彩級收尾人。他背景深沉，曾經營孤兒院致力贖罪，卻因遭「堇紫淚滴」伊織設局而失去一切。現任邊獄公司LCB部門嚮導，性格冷酷毒舌，但實則溫柔，對罪人們態度逐漸緩和。" },
            { name: "Vergilius 卡戎", tag: "Guide / LCB", files: ["Charon.png"], intro: "Limbus Company 的司機大佬。", bg: "除了駕駛技術也許有點差而已。", story: "是邊獄巴士的司機，本名拉佩斯（Lapis），曾是維吉里烏斯收養的孤兒。在孤兒院毀滅後，她遭環指綁架並成為玻璃窗實驗中唯一的倖存者，隨後被名為「卡戎」的人格覆蓋。" }
            
          ]},
          sinners: { label: "12 罪人", items: [
            { name: "Yi Sang 李箱", tag: "No. 01 / LCB", files: ["Yi_Sang_Portrait.png"], intro: "前天才研究員。", bg: "他在破碎的理想中觀測羽翼。", story: "第四章明白『飛翔』的不變意志。" },
            { name: "Faust 浮士德", tag: "No. 02 / LCB", files: ["Faust_Portrait.png"], intro: "全知全能的天才。", bg: "掌握都市秘密的核心。", story: "待檢索。" },
            { name: "Don Quixote 唐吉訶德", tag: "No. 03 / LCB", files: ["Don_Quixote_Portrait.png"], intro: "熱衷正義的少女。", bg: "其熱忱背後是認知的錯位。", story: "第七章直面『夢的終點』。" },
            { name: "Ryoshu 良秀", tag: "No. 04 / LCB", files: ["Ryoshu_Portrait.png"], intro: "極致的藝術家。", bg: "以刀刃作畫。", story: "待檢索。" },
            { name: "Meursault 莫爾索", tag: "No. 05 / LCB", files: ["Meursault_Portrait.png"], intro: "理性執行者。", bg: "遵循程序與指令。", story: "待檢索。" },
            { name: "Hong Lu 洪路", tag: "No. 06 / LCB", files: ["Hong_Lu_Portrait.png"], intro: "天真的大少爺。", bg: "家族背景複雜。", story: "待檢索。" },
            { name: "Heathcliff 希斯克里夫", tag: "No. 07 / LCB", files: ["Heathcliff_Portrait.png"], intro: "暴躁的戰鬥員。", bg: "呼嘯山莊的悲劇。", story: "第六章是其核心故事。" },
            { name: "Ishmael 以實瑪利", tag: "No. 08 / LCB", files: ["Ishmael_Portrait.png"], intro: "前海員。", bg: "追逐著那頭白鯨。", story: "第五章是其核心故事。" },
            { name: "Rodion 羅德昂", tag: "No. 09 / LCB", files: ["Rodion_Portrait.png"], intro: "熱情的豪放女子。", bg: "罪與罰的回憶糾纏。", story: "待檢索。" },
            { name: "Sinclair 辛克萊", tag: "No. 10 / LCB", files: ["Sinclair_Portrait.png"], intro: "懦弱但潛力巨大的少年。", bg: "家庭被屠殺的創傷。", story: "第三章核心人物。" },
            { name: "Outis 奧緹斯", tag: "No. 11 / LCB", files: ["Outis_Portrait.png"], intro: "幹練的軍官。", bg: "極度忠誠且効率。", story: "待檢索。" },
            { name: "Gregor 格里高爾", tag: "No. 12 / LCB", files: ["Gregor_Portrait.png"], intro: "老兵。", bg: "手臂異變為蟲。", story: "第一章核心人物。" }
          ]}
        }
      },
      Ruina: {
        cats: {
          librarians: { label: "總司書", items: [
            { name:"Angela 安吉拉", tag:"Director / Library", files:["Angela.png"], intro:"圖書館館長AI。", bg:"Lobotomy核心AI演化。", story:"為理解人類而建立圖書館，將人轉化為書。"},
            { name:"Roland 羅蘭", tag:"Assistant / Fixer", files:["Roland.png"], intro:"前收尾人司書。", bg:"都市底層Fixer。", story:"因妻子死亡進入圖書館尋找真相與復仇。"},
            { name:"Malkuth 馬爾庫特", tag:"Sephirah / Control", files:["Malkuth.png"], intro:"象徵成長。", bg:"控制部主管。", story:"渴望認同的努力型人格司書。"},
            { name:"Yesod 耶索德", tag:"Sephirah / Information", files:["Yesod.png"], intro:"象徵理性。", bg:"資訊部主管。", story:"極度理性，重視秩序與準確性。"},
            { name:"Hod 霍德", tag:"Sephirah / Education", files:["Hod.png"], intro:"象徵情感。", bg:"懲罰與教育部主管。", story:"溫柔但常自責，重視寬恕。"},
            { name:"Netzach 涅扎赫", tag:"Sephirah / Safety", files:["Netzach.png"], intro:"象徵逃避。", bg:"安全部主管。", story:"長期消極，以酒精逃避現實。"},
            { name:"Tiphereth 提菲瑞斯", tag:"Sephirah / Light", files:["Tiphereth_A.png","Tiphereth_B.png"], intro:"雙子司書。", bg:"人格分裂。", story:"同一存在分裂成兩個自我。"},
            { name:"Gebura 格布拉", tag:"Sephirah / Combat", files:["Gebura.png"], intro:"紅霧。", bg:"最強收尾人。", story:"從破壞者轉向守護者的戰鬥存在。"},
            { name:"Chesed 謝斯德", tag:"Sephirah / Welfare", files:["Chesed.png"], intro:"象徵慈悲。", bg:"福利部主管。", story:"理解體制但仍保持有限善意。"},
            { name:"Binah 賓赫", tag:"Sephirah / Extraction", files:["Binah.png"], intro:"象徵真理。", bg:"觀察者。", story:"理解一切但不干涉的存在。"},
            { name:"Hokma 霍克瑪", tag:"Sephirah / Records", files:["Hokma.png"], intro:"象徵記錄。", bg:"歷史保存者。", story:"記錄所有循環與真相的司書。"}
          ]},
          enemies: { label: "都市敵人", items: [
            { name: "Argalia 阿爾加利亞", tag: "漆黑沉默", files: ["Argalia_Portrait.png"], intro: "扭曲的劍客。", bg: "以音樂作為其殺戮的美學。", story: "終焉演奏會的指揮者。" }
          ]}
        }
      },
      Lobotomy: {
        cats: {
          founders: { label: "創始者與 AI", items: [
            { name: "Ayin 艾因", tag: "A", files: ["Ayin_Portrait.png"], intro: "腦葉公司的奠基人。", bg: "計畫推動者，將自我完全耗盡。", story: "第 50 天歸途。" },
            { name: "Carmen 卡門", tag: "C", files: ["Carmen_Portrait.png"], intro: "最初的理想與計畫起源。", bg: "死於對集體認知的早期實驗。", story: "化作光之幽靈，引導著扭曲。" },
            { name: "Angela 安吉拉", tag: "AI / Founder", files: ["Angela_Portrait.png"], intro: "公司的秘書 AI。", bg: "在漫長循環中覺醒的機器意志。", story: "從被設計的工具轉化為選擇者。" }
          ]},
          sephirah: { label: "部門主管", items: [
            { name: "Malkuth", tag: "控制部主管", files: ["Malkuth.png"], intro: "第一部門 Sephirah。", bg: "情緒豐富且講究效率。", story: "代表控制與壓制。" },
            { name: "Yesod", tag: "情報部主管", files: ["Yesod.png"], intro: "規則導向管理者。", bg: "注重系統效率與結構。", story: "將流程極大化。" },
            { name: "Hod", tag: "培訓部主管", files: ["Hod.png"], intro: "善於理解與照顧他人。", bg: "為情感與秩序提供緩衝。", story: "在修復中尋求自我確認。" },
            { name: "Binah", tag: "研發部主管", files: ["Binah.png"], intro: "冷冽且接近真相。", bg: "掌握了最深層的認知機密。", story: "待檢索。" }
          ]},
          abnormalities: { label: "異想體", items: [
            { name: "Nothing There 一無所有", tag: "ALEPH", files: ["Nothing_There.png"], intro: "擬態異想體。", bg: "渴望人類的外殼與愛。", story: "「你好」——它重複著這句話。" },
            { name: "WhiteNight 白夜", tag: "ALEPH / 救贖", files: ["WhiteNight.png"], intro: "宣稱要救贖眾生，實則實行絕對統治的異想體。", bg: "身邊環繞著十二名使徒，隨時準備迎接所謂的降臨。", story: "「當時間終結之時，我將在此引導你們。」" },
            { name: "Mountain of Smiling Bodies 屍山", tag: "ALEPH / 飢餓", files: ["MosB.png"], intro: "由無數屍體堆疊而成的恐怖異想體。", bg: "會吞噬周遭的屍體來壯大體積，其哭聲中夾雜著笑聲。", story: "一旦壓制失敗，它將化為吞噬整間公司的血肉風暴。" }
          ]}
        }
      }
    };

    let state = { game: "Limbus", cat: "sinners", item: null, keyword: "" };

    function makePlaceholder(name) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="360"><rect width="100%" height="100%" fill="#0a0a0a"/><rect x="10" y="10" width="280" height="340" fill="none" stroke="#d4af37" stroke-width="2"/><text x="50%" y="50%" fill="#d4af37" font-size="24" font-weight="bold" text-anchor="middle">${name.split(' ')[0]}</text><text x="50%" y="60%" fill="#ff3b3b" font-family="monospace" font-size="12" text-anchor="middle">ARCHIVE_ENCRYPTED</text></svg>`;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    function attachImg(imgEl, item) {
      if (!item.files || item.files.length === 0) {
        imgEl.src = makePlaceholder(item.name);
        return;
      }
      const fileName = item.files[0].replace(/ /g, "_");
      const local = `${LOCAL[state.game]}${fileName}`;
      const wiki = state.game === "Lobotomy" ? null : `https://${state.game.toLowerCase()}company.wiki.gg/images/${fileName}`;
      
      imgEl.src = local;
      imgEl.onerror = () => {
        if (wiki) {
          imgEl.onerror = () => { imgEl.src = makePlaceholder(item.name); };
          imgEl.src = wiki;
        } else {
          imgEl.src = makePlaceholder(item.name);
        }
      };
    }

    function render() {
      const grid = document.getElementById("dataGrid");
      grid.innerHTML = "";
      const items = DB[state.game].cats[state.cat].items;
      
      items.filter(i => i.name.toLowerCase().includes(state.keyword.toLowerCase()) || i.tag.toLowerCase().includes(state.keyword.toLowerCase()))
      .forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openM(item);
        const img = document.createElement("img");
        attachImg(img, item);
        card.innerHTML = `<div class="img-box"></div><div class="card-info"><small>${item.tag}</small><h3>${item.name}</h3></div>`;
        card.querySelector(".img-box").appendChild(img);
        grid.appendChild(card);
      });
    }

    function renderNav() {
      const gNav = document.getElementById("gameNav");
      gNav.innerHTML = "";
      Object.keys(DB).forEach(g => {
        const btn = document.createElement("button");
        btn.innerText = g.toUpperCase();
        if(state.game === g) btn.className = "active";
        btn.onclick = () => { state.game = g; state.cat = Object.keys(DB[g].cats)[0]; renderNav(); render(); };
        gNav.appendChild(btn);
      });

      const sNav = document.getElementById("subnav");
      sNav.innerHTML = "";
      Object.keys(DB[state.game].cats).forEach(c => {
        const btn = document.createElement("button");
        btn.innerText = DB[state.game].cats[c].label;
        if(state.cat === c) btn.className = "active";
        btn.onclick = () => { state.cat = c; renderNav(); render(); };
        sNav.appendChild(btn);
      });
    }

    function openM(item) {
      state.item = item;
      document.getElementById("modalTitle").innerText = item.name;
      document.getElementById("modalTag").innerText = item.tag;
      attachImg(document.getElementById("modalImg"), item);
      setT('intro', document.querySelector(".tab-btn"));
      document.getElementById("detailModal").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeM() { document.getElementById("detailModal").classList.remove("open"); document.body.style.overflow = ""; }

    function setT(type, btn) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("modalBody").innerText = state.item[type] || "資料加密中，待檢索...";
    }

    document.getElementById("searchInput").oninput = (e) => { state.keyword = e.target.value; render(); };

    window.onload = () => {
      renderNav(); render();
      setTimeout(() => document.getElementById("loading").classList.add("hide"), 800);
    };
  </script>
</body>
</html>
