<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>PROJECT MOON ARCHIVE</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>PROJECT MOON ARCHIVE</h1>
        <div class="game-selector">
            <button class="game-btn active" data-game="LimbusCompany">LIMBUS COMPANY</button>
            <button class="game-btn" data-game="LibraryOfRuina">LIBRARY OF RUINA</button>
            <button class="game-btn" data-game="LobotomyCorp">LOBOTOMY CORP</button>
        </div>
    </header>

    <nav id="subnav"></nav>

    <div class="search-area">
        <input type="text" id="search" placeholder="> 檢索機密檔案...">
    </div>

    <main class="container" id="dataGrid"></main>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-layout">
                <div class="modal-image-side">
                    <img id="modalImg" src="">
                </div>
                <div class="modal-text-side">
                    <h2 id="modalTitle"></h2>
                    <div class="modal-tabs">
                        <button id="btnDetails" class="tab-btn active" onclick="setTab('details')">檔案介紹</button>
                        <button id="btnStory" class="tab-btn" onclick="setTab('story')">核心故事</button>
                    </div>
                    <div id="modalBodyText" class="modal-body-text"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
<script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
